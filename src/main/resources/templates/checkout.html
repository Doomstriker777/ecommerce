<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - AB Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, var(--dark), #1a1a2e) !important; }
        .navbar-brand { font-weight: 700; }
        .navbar-brand span { color: var(--secondary); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .badge-cart { position: absolute; top: -5px; right: -10px; background: var(--secondary); font-size: 0.7rem; }
        .footer { background: var(--dark); color: white; padding: 30px 0; }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}"><i class="fas fa-store me-2"></i>AB <span>Mart</span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}"><i class="fas fa-shopping-cart"></i> Back to Cart</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="fw-bold mb-4"><i class="fas fa-credit-card text-primary me-2"></i> Checkout &amp; Shipping</h2>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Shipping Details Form -->
        <div class="col-lg-7">
            <div class="card p-4">
                <h4 class="fw-bold mb-3"><i class="fas fa-truck text-primary me-2"></i> Shipping Address</h4>
                <form th:action="@{/orders/place}" method="post">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Street Address</label>
                            <input type="text" class="form-control" name="shippingAddress"
                                   th:value="${user != null ? user.address : ''}" placeholder="123 Anime St, Apt 4" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text" class="form-control" name="shippingCity"
                                   th:value="${user != null ? user.city : ''}" placeholder="Tokyo" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">State / Region</label>
                            <input type="text" class="form-control" name="shippingState"
                                   th:value="${user != null ? user.state : ''}" placeholder="Kanto" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Zip / Postal Code</label>
                            <input type="text" class="form-control" name="shippingZip"
                                   th:value="${user != null ? user.zipCode : ''}" placeholder="100-0001" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Contact Phone</label>
                            <input type="tel" class="form-control" name="shippingPhone"
                                   th:value="${user != null ? user.phone : ''}" placeholder="+1 (555) 000-0000" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Order Notes (Optional)</label>
                            <textarea class="form-control" name="notes" rows="2" placeholder="Special delivery instructions..."></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                                <i class="fas fa-check-circle me-2"></i> Confirm &amp; Place Order
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Order Review -->
        <div class="col-lg-5">
            <div class="card p-4">
                <h4 class="fw-bold mb-3"><i class="fas fa-box-open text-primary me-2"></i> Order Summary</h4>
                <div class="list-group list-group-flush mb-3">
                    <div th:each="item : ${cartItems}" class="list-group-item d-flex justify-content-between align-items-center px-0">
                        <div class="d-flex align-items-center">
                            <img th:src="@{${item.product.imageUrl}}"
                                 onerror="this.src='https://placehold.co/50x50/6C63FF/white?text=Anime'"
                                 class="rounded me-2" style="width: 50px; height: 50px; object-fit: cover;" alt="product">
                            <div>
                                <h6 class="mb-0 text-truncate" style="max-width: 180px;" th:text="${item.product.name}">Product Name</h6>
                                <small class="text-muted" th:text="'Qty: ' + ${item.quantity}">Qty: 1</small>
                            </div>
                        </div>
                        <span class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}">$0.00</span>
                    </div>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal</span>
                    <span class="fw-semibold" th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Shipping</span>
                    <span class="text-success fw-bold">FREE Express</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                    <span class="fw-bold fs-5">Total</span>
                    <span class="fw-bold fs-5 text-primary" th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</span>
                </div>
                <div class="alert alert-light border small text-muted mb-0">
                    <i class="fas fa-info-circle me-1 text-primary"></i> Payment processing will be completed upon delivery or simulated order confirmation.
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer mt-auto text-center">
    <div class="container">
        <p class="mb-0">&copy; 2026 AB Mart. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
