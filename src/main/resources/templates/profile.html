<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AB Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, var(--dark), #1a1a2e) !important; }
        .navbar-brand { font-weight: 700; }
        .navbar-brand span { color: var(--secondary); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .badge-cart { position: absolute; top: -5px; right: -10px; background: var(--secondary); font-size: 0.7rem; }
        .footer { background: var(--dark); color: white; padding: 30px 0; }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}"><i class="fas fa-store me-2"></i>AB <span>Mart</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative" th:href="@{/cart}">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge badge-cart rounded-pill" th:text="${cartItemCount}" th:if="${cartItemCount > 0}">0</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/wishlist}"><i class="fas fa-heart"></i></a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link active" th:href="@{/profile}"><i class="fas fa-user"></i></a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/orders}"><i class="fas fa-box"></i></a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link"><i class="fas fa-sign-out-alt"></i></button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4">
        <!-- Sidebar User Overview -->
        <div class="col-lg-4">
            <div class="card p-4 text-center">
                <div class="avatar-circle mx-auto mb-3 bg-primary text-white d-flex align-items-center justify-content-center rounded-circle" style="width: 80px; height: 80px; font-size: 2rem;">
                    <i class="fas fa-user"></i>
                </div>
                <h4 class="fw-bold mb-1" th:text="${user.username}">Username</h4>
                <p class="text-muted small mb-3" th:text="${user.email}">user@example.com</p>
                <div class="d-inline-block">
                    <span class="badge bg-primary px-3 py-1" th:text="${user.role}">USER</span>
                </div>
                <hr class="my-4">
                <div class="text-start">
                    <p class="mb-2"><i class="fas fa-calendar-alt text-muted me-2"></i> Member since <span class="fw-semibold" th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">Jan 2024</span></p>
                    <p class="mb-2"><i class="fas fa-box text-muted me-2"></i> <a th:href="@{/orders}" class="text-decoration-none">View Order History</a></p>
                    <p class="mb-0"><i class="fas fa-heart text-muted me-2"></i> <a th:href="@{/wishlist}" class="text-decoration-none">View Wishlist</a></p>
                </div>
            </div>
        </div>

        <!-- Profile Update Form -->
        <div class="col-lg-8">
            <div class="card p-4">
                <h4 class="fw-bold mb-4"><i class="fas fa-user-edit text-primary me-2"></i> Personal Information</h4>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/profile/update}" th:object="${profileForm}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" class="form-control" th:field="*{firstName}" placeholder="First name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" class="form-control" th:field="*{lastName}" placeholder="Last name">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" th:field="*{phone}" placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Street Address</label>
                            <input type="text" class="form-control" th:field="*{address}" placeholder="Street address">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text" class="form-control" th:field="*{city}" placeholder="City">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">State</label>
                            <input type="text" class="form-control" th:field="*{state}" placeholder="State">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Zip Code</label>
                            <input type="text" class="form-control" th:field="*{zipCode}" placeholder="Zip code">
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="fas fa-save me-2"></i> Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="footer mt-auto text-center">
    <div class="container">
        <p class="mb-0">&copy; 2026 AB Mart. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
