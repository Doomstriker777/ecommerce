<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AB Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; }
        .sidebar { background: var(--dark); min-height: 100vh; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); padding: 12px 20px; font-weight: 500; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background: rgba(255,255,255,0.1); border-left: 4px solid var(--secondary); }
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <h4 class="fw-bold text-white mb-4"><i class="fas fa-store me-2"></i>AB Mart <span class="badge bg-danger fs-6">Admin</span></h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin}"><i class="fas fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/products}"><i class="fas fa-boxes me-2"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/orders}"><i class="fas fa-shopping-bag me-2"></i> Orders</a></li>
                <li class="nav-item mt-4"><a class="nav-link text-warning" th:href="@{/home}"><i class="fas fa-arrow-left me-2"></i> Back to Store</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="fw-bold mb-4">Store Overview</h2>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card stat-card p-4 bg-primary text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-uppercase fw-semibold">Products</small>
                                <h2 class="fw-bold mb-0" th:text="${totalProducts}">0</h2>
                            </div>
                            <i class="fas fa-boxes fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-4 bg-success text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-uppercase fw-semibold">Orders</small>
                                <h2 class="fw-bold mb-0" th:text="${totalOrders}">0</h2>
                            </div>
                            <i class="fas fa-shopping-bag fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-4 bg-info text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-uppercase fw-semibold">Customers</small>
                                <h2 class="fw-bold mb-0" th:text="${totalUsers}">0</h2>
                            </div>
                            <i class="fas fa-users fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-4 bg-warning text-dark">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-uppercase fw-semibold">Categories</small>
                                <h2 class="fw-bold mb-0" th:text="${totalCategories}">0</h2>
                            </div>
                            <i class="fas fa-tags fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Orders Table -->
            <div class="card border-0 shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Recent Orders</h5>
                    <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-primary">View All Orders</a>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Order #</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${recentOrders}">
                                <td class="fw-bold" th:text="'#' + ${order.id}">#1</td>
                                <td th:text="${order.user.username}">User</td>
                                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                                <td class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td>
                                <td>
                                    <span th:if="${order.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Pending</span>
                                    <span th:if="${order.status.name() == 'CONFIRMED'}" class="badge bg-info">Confirmed</span>
                                    <span th:if="${order.status.name() == 'SHIPPED'}" class="badge bg-primary">Shipped</span>
                                    <span th:if="${order.status.name() == 'DELIVERED'}" class="badge bg-success">Delivered</span>
                                    <span th:if="${order.status.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                                </td>
                                <td>
                                    <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-secondary">View</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
