<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - AB Mart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; }
        .sidebar { background: var(--dark); min-height: 100vh; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); padding: 12px 20px; font-weight: 500; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background: rgba(255,255,255,0.1); border-left: 4px solid var(--secondary); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <h4 class="fw-bold text-white mb-4"><i class="fas fa-store me-2"></i>AB Mart <span class="badge bg-danger fs-6">Admin</span></h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="fas fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/products}"><i class="fas fa-boxes me-2"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/orders}"><i class="fas fa-shopping-bag me-2"></i> Orders</a></li>
                <li class="nav-item mt-4"><a class="nav-link text-warning" th:href="@{/home}"><i class="fas fa-arrow-left me-2"></i> Back to Store</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Products Catalog</h2>
                <span class="badge bg-primary fs-6" th:text="${#lists.size(products)} + ' Products'">0 Products</span>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td class="fw-bold" th:text="${product.id}">1</td>
                                <td>
                                    <img th:src="@{${product.imageUrl}}"
                                         onerror="this.src='https://placehold.co/50x50/6C63FF/white?text=Anime'"
                                         class="rounded" style="width: 50px; height: 50px; object-fit: cover;" alt="product">
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${product.name}">Product Name</div>
                                    <small class="text-muted" th:text="${#strings.abbreviate(product.description, 40)}">Desc</small>
                                </td>
                                <td><span class="badge bg-light text-dark border" th:text="${product.category != null ? product.category.name : 'None'}">Category</span></td>
                                <td class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
                                <td th:text="${product.stockQuantity}">10</td>
                                <td>
                                    <span th:if="${product.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${product.active}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td>
                                    <a th:href="@{/product/{id}(id=${product.id})}" target="_blank" class="btn btn-sm btn-outline-primary" title="View"><i class="fas fa-eye"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
