<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - AB Mart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; }
        .sidebar { background: var(--dark); min-height: 100vh; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); padding: 12px 20px; font-weight: 500; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background: rgba(255,255,255,0.1); border-left: 4px solid var(--secondary); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <h4 class="fw-bold text-white mb-4"><i class="fas fa-store me-2"></i>AB Mart <span class="badge bg-danger fs-6">Admin</span></h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="fas fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/products}"><i class="fas fa-boxes me-2"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/orders}"><i class="fas fa-shopping-bag me-2"></i> Orders</a></li>
                <li class="nav-item mt-4"><a class="nav-link text-warning" th:href="@{/home}"><i class="fas fa-arrow-left me-2"></i> Back to Store</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Customer Orders</h2>
                <div class="btn-group">
                    <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm">All</a>
                    <a th:href="@{/admin/orders(status='PENDING')}" class="btn btn-outline-warning btn-sm">Pending</a>
                    <a th:href="@{/admin/orders(status='CONFIRMED')}" class="btn btn-outline-info btn-sm">Confirmed</a>
                    <a th:href="@{/admin/orders(status='SHIPPED')}" class="btn btn-outline-primary btn-sm">Shipped</a>
                    <a th:href="@{/admin/orders(status='DELIVERED')}" class="btn btn-outline-success btn-sm">Delivered</a>
                </div>
            </div>

            <!-- Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Order #</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Current Status</th>
                                <th>Update Status</th>
                                <th>View</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="fw-bold" th:text="'#' + ${order.id}">#1</td>
                                <td>
                                    <div class="fw-bold" th:text="${order.user.username}">User</div>
                                    <small class="text-muted" th:text="${order.shippingCity + ', ' + order.shippingState}">Location</small>
                                </td>
                                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                                <td class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td>
                                <td>
                                    <span th:if="${order.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Pending</span>
                                    <span th:if="${order.status.name() == 'CONFIRMED'}" class="badge bg-info">Confirmed</span>
                                    <span th:if="${order.status.name() == 'SHIPPED'}" class="badge bg-primary">Shipped</span>
                                    <span th:if="${order.status.name() == 'DELIVERED'}" class="badge bg-success">Delivered</span>
                                    <span th:if="${order.status.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex gap-1">
                                        <select name="status" class="form-select form-select-sm" style="width: 130px;">
                                            <option value="PENDING" th:selected="${order.status.name() == 'PENDING'}">PENDING</option>
                                            <option value="CONFIRMED" th:selected="${order.status.name() == 'CONFIRMED'}">CONFIRMED</option>
                                            <option value="SHIPPED" th:selected="${order.status.name() == 'SHIPPED'}">SHIPPED</option>
                                            <option value="DELIVERED" th:selected="${order.status.name() == 'DELIVERED'}">DELIVERED</option>
                                            <option value="CANCELLED" th:selected="${order.status.name() == 'CANCELLED'}">CANCELLED</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-check"></i></button>
                                    </form>
                                </td>
                                <td>
                                    <a th:href="@{/orders/{id}(id=${order.id})}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="fas fa-eye"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
