<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - AB Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-code { font-size: 8rem; font-weight: 900; color: var(--secondary); text-shadow: 0 4px 20px rgba(255,101,132,0.4); }
    </style>
</head>
<body class="text-center">
<div class="container py-5">
    <div class="error-code">404</div>
    <h2 class="fw-bold mb-3">Lost in Another Dimension?</h2>
    <p class="text-light opacity-75 mb-4 fs-5">The anime treasure you're searching for seems to have vanished through an alternate portal.</p>
    <a th:href="@{/home}" class="btn btn-primary btn-lg px-4"><i class="fas fa-home me-2"></i> Return to AB Mart</a>
</div>
</body>
</html>
