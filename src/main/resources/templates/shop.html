<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle != null ? pageTitle + ' - AB Mart' : 'Shop - AB Mart'}">Shop - AB Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6C63FF; --secondary: #FF6584; --dark: #2D2B55; }
        .navbar { background: linear-gradient(135deg, var(--dark), #1a1a2e) !important; }
        .navbar-brand { font-weight: 700; }
        .navbar-brand span { color: var(--secondary); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .product-card { border: none; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 15px rgba(0,0,0,0.08); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .price { color: var(--primary); font-weight: 700; font-size: 1.1rem; }
        .img-placeholder { background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; height: 200px; }
        .category-sidebar .list-group-item.active { background: var(--primary); border-color: var(--primary); }
        .badge-cart { position: absolute; top: -5px; right: -10px; background: var(--secondary); font-size: 0.7rem; }
        .footer { background: var(--dark); color: white; padding: 30px 0; }
        .rating .fas { color: #FFD700; }
        .rating .far { color: #ddd; }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}"><i class="fas fa-store me-2"></i>AB <span>Mart</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/shop}">Shop</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
            </ul>
            <form class="d-flex me-3" th:action="@{/shop/search}" method="get">
                <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Search..." th:value="${searchQuery}">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-search"></i></button>
            </form>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative" th:href="@{/cart}"><i class="fas fa-shopping-cart"></i>
                        <span class="badge badge-cart rounded-pill" th:text="${cartItemCount}" th:if="${cartItemCount > 0}">0</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/wishlist}"><i class="fas fa-heart"></i></a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/profile}"><i class="fas fa-user"></i></a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline"><button class="nav-link btn btn-link" type="submit"><i class="fas fa-sign-out-alt"></i></button></form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" th:href="@{/login}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-3 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold">Categories</div>
                <div class="list-group list-group-flush category-sidebar">
                    <a th:href="@{/shop}" class="list-group-item list-group-item-action" th:classappend="${selectedCategory == null} ? 'active'">All Products</a>
                    <a th:each="entry : ${categoryWithCounts}"
                       th:href="@{/shop/category/{id}(id=${entry.key.id})}"
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                       th:classappend="${selectedCategory != null && selectedCategory.id == entry.key.id} ? 'active'">
                        <span th:text="${entry.key.name}">Category</span>
                        <span class="badge bg-secondary rounded-pill" th:text="${entry.value}">0</span>
                    </a>
                </div>
            </div>
            <!-- Price Filter -->
            <div class="card border-0 shadow-sm mt-3">
                <div class="card-header bg-white fw-bold">Filter by Price</div>
                <div class="card-body">
                    <form th:action="@{/shop}" method="get">
                        <div class="mb-2">
                            <input type="number" name="minPrice" class="form-control form-control-sm" placeholder="Min $" th:value="${minPrice}" step="0.01">
                        </div>
                        <div class="mb-2">
                            <input type="number" name="maxPrice" class="form-control form-control-sm" placeholder="Max $" th:value="${maxPrice}" step="0.01">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Apply Filter</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Products -->
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 th:text="${pageTitle}">All Products</h4>
                <div class="d-flex align-items-center">
                    <label class="me-2 text-muted small">Sort:</label>
                    <select class="form-select form-select-sm" style="width:auto" onchange="window.location.href=this.value">
                        <option value="?sort=" th:selected="${currentSort == null}">Default</option>
                        <option th:value="${selectedCategory != null} ? '/shop/category/' + ${selectedCategory.id} + '?sort=price-asc' : '/shop?sort=price-asc'" th:selected="${currentSort == 'price-asc'}">Price: Low to High</option>
                        <option th:value="${selectedCategory != null} ? '/shop/category/' + ${selectedCategory.id} + '?sort=price-desc' : '/shop?sort=price-desc'" th:selected="${currentSort == 'price-desc'}">Price: High to Low</option>
                        <option th:value="${selectedCategory != null} ? '/shop/category/' + ${selectedCategory.id} + '?sort=name-asc' : '/shop?sort=name-asc'" th:selected="${currentSort == 'name-asc'}">Name: A-Z</option>
                        <option th:value="${selectedCategory != null} ? '/shop/category/' + ${selectedCategory.id} + '?sort=rating' : '/shop?sort=rating'" th:selected="${currentSort == 'rating'}">Rating</option>
                        <option th:value="${selectedCategory != null} ? '/shop/category/' + ${selectedCategory.id} + '?sort=newest' : '/shop?sort=newest'" th:selected="${currentSort == 'newest'}">Newest</option>
                    </select>
                </div>
            </div>
            <p class="text-muted" th:if="${searchQuery}">Showing results for "<span th:text="${searchQuery}"></span>" (<span th:text="${products.size()}"></span> found)</p>

            <div class="row g-4" th:if="${products != null && !products.isEmpty()}">
                <div class="col-md-4 col-sm-6" th:each="product : ${products}">
                    <div class="card product-card h-100">
                        <div class="position-relative overflow-hidden" style="height: 220px; background: #2D2B55;">
                            <img th:src="@{${product.imageUrl}}" class="card-img-top w-100 h-100" style="object-fit: cover; transition: transform 0.3s;" onerror="this.src='https://placehold.co/300x220/2D2B55/white?text=Anime+Merch'" th:alt="${product.name}">
                            <span class="badge badge-featured position-absolute top-0 end-0 m-2" th:if="${product.featured}">Featured</span>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <small class="text-muted" th:text="${product.category.name}">Category</small>
                            <h6 class="card-title mt-1" th:text="${product.name}">Product</h6>
                            <div class="rating mb-1">
                                <span th:each="i : ${#numbers.sequence(1, 5)}">
                                    <i th:class="${i <= product.rating} ? 'fas fa-star' : 'far fa-star'" style="font-size: 0.75rem;"></i>
                                </span>
                                <small class="text-muted" th:text="'(' + ${product.reviewCount} + ')'"></small>
                            </div>
                            <div class="mt-auto">
                                <span class="price" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</span>
                                <span class="text-muted small ms-2" th:if="${product.stockQuantity <= 5 && product.stockQuantity > 0}" th:text="'Only ' + ${product.stockQuantity} + ' left!'"></span>
                                <span class="text-danger small ms-2" th:if="${product.stockQuantity == 0}">Out of Stock</span>
                            </div>
                            <div class="mt-2 d-flex gap-2">
                                <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary flex-fill">View</a>
                                <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" sec:authorize="isAuthenticated()" th:if="${product.stockQuantity > 0}">
                                    <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-cart-plus"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center py-5" th:if="${products == null || products.isEmpty()}">
                <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                <p class="text-muted">No products found.</p>
                <a th:href="@{/shop}" class="btn btn-primary">View All Products</a>
            </div>
        </div>
    </div>
</div>

<footer class="footer mt-5">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 AB Mart. All rights reserved.</p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
