<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - AB Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #2D2B55, #1a1a2e); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .btn-primary { background: #6C63FF; border-color: #6C63FF; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3><i class="fas fa-store me-2"></i>AB <span style="color: #FF6584">Mart</span></h3>
                        <p class="text-muted">Sign in to your account</p>
                    </div>
                    <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
                    <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
                    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" name="remember-me" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                        <p class="text-center mb-0">Don't have an account? <a th:href="@{/register}">Register here</a></p>
                    </form>
                </div>
            </div>
            <p class="text-center text-white-50 mt-3"><a th:href="@{/home}" class="text-white-50"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></p>
        </div>
    </div>
</div>
</body>
</html>
